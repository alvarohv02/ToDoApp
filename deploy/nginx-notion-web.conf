# La web, accesible solo desde Tailscale en http://notion.tudominio.es
#
# El registro DNS "notion" apunta a la IP de Tailscale del servidor (100.x.x.x), que solo es
# alcanzable con Tailscale conectado. Además nginx rechaza cualquier otra procedencia.
# El tráfico va cifrado por el túnel de Tailscale aunque la URL sea http://.
#
# Instalación:
#   sudo cp deploy/nginx-notion-web.conf /etc/nginx/sites-available/notion-web
#   sudo ln -s /etc/nginx/sites-available/notion-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name notion.tudominio.es;

    allow 100.64.0.0/10;        # IPs de Tailscale
    allow fd7a:115c:a1e0::/48;  # IPs de Tailscale (IPv6)
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
