# La web con HTTPS dentro de Tailscale, para instalarla como app en el móvil.
#
# Una app instalable (PWA) exige HTTPS. Let's Encrypt no sirve para una IP de Tailscale, pero
# Tailscale emite certificados válidos para el nombre de la máquina (NOMBRE_TAILSCALE.ts.net).
# Se usa el puerto 8443 porque el 443 de ese nombre ya lo ocupa Nextcloud.
#
# Instalación (ver "Instalar la web como app" en INSTALAR.md):
#   sudo tailscale cert --cert-file /etc/nginx/ts-certs/nextcloud.crt --key-file /etc/nginx/ts-certs/nextcloud.key NOMBRE_TAILSCALE.ts.net
#   sudo cp /opt/notion/deploy/nginx-notion-app.conf /etc/nginx/sites-available/notion-app
#   sudo sed -i 's/NOMBRE_TAILSCALE/mi-servidor.tailXXXX/' /etc/nginx/sites-available/notion-app
#   sudo ln -s /etc/nginx/sites-available/notion-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name NOMBRE_TAILSCALE.ts.net;

    # Mismo certificado que Nextcloud (lo renueva el mismo cron)
    ssl_certificate     /etc/nginx/ts-certs/nextcloud.crt;
    ssl_certificate_key /etc/nginx/ts-certs/nextcloud.key;

    allow 100.64.0.0/10;        # IPs de Tailscale
    allow fd7a:115c:a1e0::/48;  # IPs de Tailscale (IPv6)
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
