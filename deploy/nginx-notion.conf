# Sitio de nginx. Solo /webhook/ queda abierto a Internet (Meta tiene que poder llamarlo);
# la web, que no tiene login, solo es accesible desde tu red local.
# Instalación:
#   sudo cp deploy/nginx-notion.conf /etc/nginx/sites-available/notion
#   sudo ln -s /etc/nginx/sites-available/notion /etc/nginx/sites-enabled/
#   (cambia server_name por tu dominio)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bot.tudominio.es     # añade el HTTPS que exige Meta
server {
    listen 80;
    server_name bot.tudominio.es;

    location /webhook/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Páginas públicas que Google exige para la app de Google Calendar (página principal y privacidad)
    location /legal/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }
}
